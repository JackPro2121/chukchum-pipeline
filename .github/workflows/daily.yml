name: ChukChum Auto Publish

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Checkout media repo
        uses: actions/checkout@v4
        with:
          repository: JackPro2121/chukchum-media
          path: media-repo
          token: ${{ secrets.MEDIA_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.email "bot@chukchum.local"
          git config --global user.name "ChukChum Bot"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/media-repo"
          echo "MEDIA_REPO_DIR=$GITHUB_WORKSPACE/media-repo" >> "$GITHUB_ENV"

      - name: Run daily pipeline (queue gate, fetch, publish)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: gemma4:31b
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ENABLED_SERVICES: facebook
          MAX_QUEUE_PER_CHANNEL: "8"
          MAX_POSTS_PER_RUN: "1"
          FETCH_ONLY_IF_QUEUE_EMPTY: "true"
          MEDIA_REPO: JackPro2121/chukchum-media
        run: python src/run_daily.py

      - name: Commit state
        run: |
          git add data/state.db data/targets.csv || true
          git diff --staged --quiet || git commit -m "state: processed sources"
          git push || true